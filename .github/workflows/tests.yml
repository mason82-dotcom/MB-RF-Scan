name: Python tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Run unit tests
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -q
          else
            echo "Warte auf den einmaligen Pi-Quellcodeimport."
          fi
